<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Grabber</title>
  <link rel="icon" type="image/x-icon" sizes="16x16" href="../favicon-16x16.ico">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="../favicon-32x32.ico">
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="../silence-remover/mobile-only.css?v=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <header class="app-header">
        <div class="logo-area">
          <span class="eyebrow">ItMatZip</span>
          <div class="logo-title-row">
            <h1>Thumbnail <span class="accent">Grabber</span></h1>
            <a href="../index.html" class="btn-to-dashboard">대시보드로 이동</a>
          </div>
          <p class="header-tagline">유튜브 주소만 붙여넣으면 썸네일을 바로 저장합니다.</p>
        </div>
      </header>

      <div class="editor-ad editor-ad-exempt" id="editor-ad-above-path" aria-label="광고"></div>

      <section class="composer" aria-label="유튜브 주소">
        <label class="composer-label" for="video-url">유튜브 주소</label>
        <p class="composer-hint">watch, youtu.be, Shorts, embed 주소를 붙여넣으세요. 영상 ID만 넣어도 됩니다.</p>
        <div class="composer-row">
          <input
            type="url"
            id="video-url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://www.youtube.com/watch?v=…"
          >
          <button type="button" id="btn-paste" class="btn-ghost">붙여넣기</button>
          <button type="button" id="btn-fetch" class="btn-primary">가져오기</button>
        </div>
        <p class="composer-status" id="composer-status" role="status" aria-live="polite"></p>
      </section>

      <section class="stage" id="stage" data-state="empty" aria-label="썸네일 미리보기">
        <div class="stage-empty" id="stage-empty">
          <div class="stage-frame" aria-hidden="true"></div>
          <p>주소를 넣으면 여기에 가장 큰 썸네일이 표시됩니다.</p>
        </div>
        <div class="stage-loading" id="stage-loading" hidden>
          <div class="stage-skeleton" aria-hidden="true"></div>
          <p>썸네일을 찾는 중…</p>
        </div>
        <div class="stage-ready" id="stage-ready" hidden>
          <div class="hero">
            <img id="hero-image" class="hero-image" alt="선택한 유튜브 썸네일" decoding="async">
            <div class="hero-meta">
              <span class="hero-chip" id="hero-quality"></span>
              <span class="hero-chip hero-chip--muted" id="hero-size"></span>
            </div>
          </div>
          <div class="hero-actions">
            <button type="button" id="btn-download-best" class="btn-primary btn-wide">최고 화질 저장</button>
            <button type="button" id="btn-copy-url" class="btn-ghost">이미지 주소 복사</button>
            <button type="button" id="btn-open-tab" class="btn-ghost">새 탭에서 열기</button>
          </div>
        </div>
      </section>

      <section class="qualities" id="qualities" hidden aria-label="화질 목록">
        <div class="qualities-head">
          <h2>화질 선택</h2>
          <p id="qualities-meta"></p>
        </div>
        <div class="quality-grid" id="quality-grid"></div>
      </section>

      <div class="editor-ad editor-ad-exempt" id="editor-ad-below-export" aria-label="광고"></div>
    </main>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <div id="mobile-only-overlay" class="mobile-only-overlay is-hidden" role="alertdialog" aria-modal="true" aria-labelledby="mobile-only-title">
    <div class="mobile-only-card">
      <div class="mobile-only-icon" aria-hidden="true">🖥️</div>
      <h2 id="mobile-only-title" class="mobile-only-title">PC에서만 이용할 수 있습니다</h2>
      <p class="mobile-only-desc">ItMatZip Tools는 데스크톱 PC 환경에 최적화되어 있습니다.<br>PC 브라우저로 접속해 주세요.</p>
    </div>
  </div>

  <script type="module" src="../common/site-modal-boot.js"></script>
  <script src="../common/site-guard.js?v=11"></script>
  <script src="../silence-remover/mobile-only.js?v=1"></script>
  <script type="module" src="script.js?v=1"></script>
</body>
</html>
