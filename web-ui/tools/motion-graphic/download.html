<!DOCTYPE html>
<html lang="ko" data-tool-id="motion-graphic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://tools.itmatzip.com/motion-graphic/">
  <script src="../common/site-runtime.js?v=43"></script>
  <meta http-equiv="Permissions-Policy" content="local-network-access=*">
  <title data-i18n="dlTitle">모션그래픽 MP4 다운로드</title>
  <link rel="icon" type="image/x-icon" sizes="16x16" href="../favicon-16x16.ico">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="../favicon-32x32.ico">
  <link rel="stylesheet" href="../silence-remover/download.css?v=7">
  <link rel="stylesheet" href="../silence-remover/mobile-only.css?v=3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    .dl-nle-item__logo--mg { background: linear-gradient(135deg, #8b5cf6, #38bdf8); color: #fff; }
    .dl-btn-folder { background: transparent; border: 1px solid rgba(148, 163, 184, 0.4); color: inherit; }
  </style>
</head>
<body>
  <div class="dl-page">
    <div class="dl-ad" id="dl-ad-top" aria-label="광고"></div>
    <div class="dl-card">
      <h1 id="dl-title" data-i18n="dlH1">모션그래픽 MP4 다운로드</h1>
      <p class="dl-status" id="dl-status"></p>
      <p class="dl-meta" id="dl-meta"></p>
      <div class="dl-spinner is-hidden" id="dl-spinner" aria-hidden="true"></div>
      <p class="dl-countdown is-hidden" id="dl-countdown" aria-live="polite"></p>
      <div class="dl-agent-hint is-hidden" id="dl-agent-hint"></div>
      <div class="dl-actions">
        <button type="button" class="dl-btn dl-btn-result" id="dl-btn-output" disabled data-i18n="dlBtnNow">MP4 다운로드</button>
        <button type="button" class="dl-btn dl-btn-folder" id="dl-btn-folder" disabled data-i18n="dlFolder">폴더 열기</button>
        <a href="index.html" class="dl-btn dl-btn-back" id="dl-btn-back" data-i18n="dlBack">편집 화면으로 돌아가기</a>
      </div>
    </div>

    <section class="dl-guides" aria-label="다운로드 안내" data-i18n-aria="dlGuidesAria">
      <article class="dl-info-card">
        <header class="dl-info-card__head">
          <span class="dl-info-card__icon" aria-hidden="true">🎬</span>
          <div>
            <h2 class="dl-info-card__title" data-i18n="dlFileGuide">파일 안내</h2>
            <p class="dl-info-card__subtitle" data-i18n="dlFileSub">원본 영상 위에 모션그래픽을 합성한 H.264 MP4 입니다</p>
          </div>
        </header>
        <ul class="dl-nle-list">
          <li class="dl-nle-item">
            <div class="dl-nle-item__brand">
              <span class="dl-nle-item__logo dl-nle-item__logo--mg" aria-hidden="true">MG</span>
              <h3 class="dl-nle-item__name" data-i18n="dlResultName">모션그래픽 MP4</h3>
            </div>
            <p class="dl-nle-item__steps" data-i18n="dlResultSteps">원본 해상도·오디오를 그대로 두고 모션그래픽 구간만 합성했습니다. 프로젝트 폴더의 output.mp4 로도 남아 있어 「폴더 열기」로 바로 찾을 수 있습니다.</p>
          </li>
        </ul>
      </article>
    </section>

    <div class="dl-ad" id="dl-ad-bottom" aria-label="광고"></div>
  </div>

  <script type="module" src="../common/site-modal-boot.js?v=4"></script>
  <script src="../common/site-guard.js?v=23"></script>
  <script src="../silence-remover/mobile-only.js?v=8"></script>
  <script type="module" src="download.js?v=1"></script>
</body>
</html>
