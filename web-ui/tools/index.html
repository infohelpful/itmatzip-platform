<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItMatZip Tools</title>
  <link rel="stylesheet" href="assets/dashboard.css?v=3">
  <link rel="stylesheet" href="silence-remover/mobile-only.css?v=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
  <div class="hub-shell">
    <aside class="hub-sidebar-ad" id="hub-sidebar-ad-slot" aria-label="광고"></aside>
    <main class="hub-main">
      <div class="hub-inner">
        <header class="hub-header">
          <span class="hub-eyebrow">ItMatZip</span>
          <h1 class="hub-title">ITMATZIP <span class="accent">Tools</span></h1>
          <p class="hub-lead">
            여러분들의 작업을 도와주는 웹 도구 모음입니다. 사용할 도구를 선택하세요. 새 도구는 계속 추가됩니다.
          </p>
        </header>

        <div class="hub-toolbar">
          <label class="hub-search-wrap">
            <span class="hub-search-icon" aria-hidden="true">⌕</span>
            <input
              type="search"
              id="hub-search"
              class="hub-search"
              placeholder="도구 이름·기능 검색…"
              autocomplete="off"
              spellcheck="false"
            >
          </label>
          <p class="hub-count" id="hub-tool-count" aria-live="polite"></p>
        </div>

        <div class="hub-ad-banner" id="hub-ad-banner" aria-label="광고"></div>

        <div class="hub-grid" id="hub-tool-grid" role="list"></div>

        <footer class="hub-footer">
          로컬 처리가 필요한 도구는 PC 브라우저와 ItMatZip 에이전트가 필요합니다.
        </footer>
      </div>
    </main>
  </div>

  <div id="mobile-only-overlay" class="mobile-only-overlay is-hidden" role="alertdialog" aria-modal="true" aria-labelledby="mobile-only-title">
    <div class="mobile-only-card">
      <div class="mobile-only-icon" aria-hidden="true">🖥️</div>
      <h2 id="mobile-only-title" class="mobile-only-title">PC에서만 이용할 수 있습니다</h2>
      <p class="mobile-only-desc">ItMatZip Tools는 데스크톱 PC 환경에 최적화되어 있습니다.<br>PC 브라우저로 접속해 주세요.</p>
    </div>
  </div>

  <script src="silence-remover/mobile-only.js?v=1"></script>
  <script type="module" src="assets/dashboard.js?v=1"></script>
</body>
</html>
